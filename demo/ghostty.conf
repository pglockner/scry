# Ghostty settings for recording the README demo (demo/record.sh passes
# this file instead of your own config).
theme = Catppuccin Mocha
font-size = 15
window-width = 110
window-height = 34
window-padding-x = 18
window-padding-y = 18
window-decoration = none
window-save-state = never
cursor-style = block
cursor-style-blink = false
shell-integration = none
confirm-close-surface = false
quit-after-last-window-closed = true
